<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加书签</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="sticky-top">
      <div class="header">
        <div class="header-title">
          <img src="icons/icon-32.png" alt="书签" class="header-icon">
          <h2>添加书签</h2>
        </div>
        <div class="header-actions">
          <button type="button" id="connection-main" class="connection-pill hidden" data-tip="点击查看连接详情" aria-label="连接延迟，点击查看详情">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-text" class="connection-text">未连接</span>
          </button>
          <button type="button" id="settings-btn" class="settings-text-btn" title="设置">设置</button>
        </div>
      </div>

      <div id="connection-panel" class="connection-panel hidden"></div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </div>

    <div id="auth-section" class="section hidden">
      <p class="info-text">请先登录到书签管理系统</p>
      <button id="goto-options" class="button button-primary">前往设置</button>
    </div>

    <div id="form-section" class="section hidden">
      <form id="bookmark-form" autocomplete="off">
        <div class="form-group">
          <label for="title">标题 *</label>
          <input type="text" id="title" required placeholder="网页标题" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="url">URL *</label>
          <input type="url" id="url" required placeholder="https://example.com" autocomplete="off">
          <div id="duplicate-hint" class="duplicate-hint hidden"></div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="description">描述</label>
            <button type="button" id="ai-btn" class="ai-icon-btn" data-tip="AI 生成描述" aria-label="AI 生成描述">
              <span class="ai-icon" aria-hidden="true">🤖</span>
              <span class="ai-spinner" aria-hidden="true"></span>
            </button>
          </div>
          <textarea id="description" rows="3" placeholder="可选的描述信息"></textarea>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label>分类 *</label>
            <button type="button" id="ai-category-btn" class="ai-icon-btn" data-tip="AI 推荐分类" aria-label="AI 推荐分类">
              <span class="ai-icon" aria-hidden="true">🏷️</span>
              <span class="ai-spinner" aria-hidden="true"></span>
            </button>
          </div>
          <div class="category-input-container">
            <input type="text" id="category-input" class="category-input" placeholder="选择分类..." autocomplete="off">
            <div class="category-suggestions hidden" id="category-suggestions"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="tags-input">标签</label>
          <div class="tags-input-container">
            <div class="tags-list" id="tags-list"></div>
            <input type="text" id="tags-input" placeholder="输入标签后回车添加" autocomplete="off">
            <div class="tags-suggestions hidden" id="tags-suggestions"></div>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="is-private">
            <span>私密书签（仅登录后可见）</span>
          </label>
        </div>

        <div class="button-group">
          <button type="submit" class="button button-primary" id="save-btn">
            <span id="save-text">保存书签</span>
          </button>
        </div>
      </form>
    </div>

    <div id="loading-section" class="section loading-section hidden">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>

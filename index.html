<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>书签管理</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app:empty {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app:empty .skeleton-header {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    #app:empty .skeleton-logo {
      width: 100px;
      height: 24px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 4px;
    }
    #app:empty .skeleton-btn {
      width: 80px;
      height: 32px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 6px;
    }
    #app:empty .skeleton-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #app:empty .skeleton-card {
      height: 80px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 8px;
    }
    #app:empty .skeleton-card:nth-child(2) { animation-delay: 0.1s; }
    #app:empty .skeleton-card:nth-child(3) { animation-delay: 0.2s; }
    #app:empty .skeleton-card:nth-child(4) { animation-delay: 0.3s; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="skeleton-header">
      <div class="skeleton-logo"></div>
      <div class="skeleton-btn"></div>
    </div>
    <div class="skeleton-content">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
